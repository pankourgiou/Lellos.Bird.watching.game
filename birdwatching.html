<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bird &amp; Coins</title>
<style>
html,body{margin:0;height:100%;background:#16303a;display:grid;place-items:center;font-family:Georgia,serif}
canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:block;touch-action:none;cursor:pointer}
</style></head><body><canvas id="c" width="960" height="540"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=960,H=540;
const R=(a,b)=>a+Math.random()*(b-a);
const TF=4.5;let form=0,fz=0;let bird={x:140,y:200,vx:0,vy:0,face:1,fl:0},tgt={x:480,y:220},score=0,t=0,coins=[],sparks=[];
const clouds=Array.from({length:5},()=>({x:R(0,W),y:R(30,170),s:R(.6,1.3),v:R(.1,.3)}));
const trees=(n,yb,h,col,sw)=>Array.from({length:n},(_,i)=>({x:i*(W/(n-1))+R(-30,30),h:h*R(.8,1.25),yb,col,ph:R(0,6),sw}));
const back=trees(12,470,150,'#2c6b52',.6),mid=trees(8,500,210,'#1f5a3f',1),front=trees(5,560,300,'#144530',1.4);
const spawn=()=>{while(coins.length<5)coins.push({x:R(60,W-60),y:R(70,330),ph:R(0,6)})};spawn();

function pos(e){const b=c.getBoundingClientRect();tgt.x=(e.clientX-b.left)/b.width*W;tgt.y=(e.clientY-b.top)/b.height*H}
c.addEventListener('pointerdown',pos);c.addEventListener('pointermove',e=>{if(e.buttons)pos(e)});
addEventListener('keydown',e=>{const k={ArrowLeft:[-60,0],ArrowRight:[60,0],ArrowUp:[0,-60],ArrowDown:[0,60],a:[-60,0],d:[60,0],w:[0,-60],s:[0,60]}[e.key];
 if(k){tgt.x=Math.max(20,Math.min(W-20,bird.x+k[0]));tgt.y=Math.max(30,Math.min(420,bird.y+k[1]))}});

function pine(tr){const sw=Math.sin(t*.8+tr.ph)*4*tr.sw,w=tr.h*.42;
 g.fillStyle='#4a3326';g.fillRect(tr.x-5,tr.yb-30,10,30);g.fillStyle=tr.col;
 for(let i=0;i<4;i++){const y=tr.yb-30-i*tr.h*.22,ww=w*(1-i*.2),sx=sw*(i/3);
  g.beginPath();g.moveTo(tr.x-ww/2+sx*.5,y);g.lineTo(tr.x+sx,y-tr.h*.34);g.lineTo(tr.x+ww/2+sx*.5,y);g.fill()}}

function drawBird(){const b=bird,fl=Math.sin(b.fl),bob=Math.sin(t*3)*2;
 g.save();g.translate(b.x+(fz>0?R(-3,3):0),b.y+bob);g.scale(b.face,1);g.rotate(Math.max(-.4,Math.min(.4,b.vy*.05))*0.8);
 g.fillStyle='#d9842c';g.beginPath();g.moveTo(-22,2);g.lineTo(-46,-6+fl*3);g.lineTo(-44,8+fl*3);g.fill();      // tail
 g.fillStyle='#f0a540';g.beginPath();g.ellipse(0,0,26,17,0,0,7);g.fill();                                       // body
 g.fillStyle='#fbe3b5';g.beginPath();g.ellipse(4,7,17,9,0,0,7);g.fill();                                       // belly
 g.fillStyle='#f0a540';g.beginPath();g.arc(20,-12,12,0,7);g.fill();                                            // head
 g.fillStyle='#ffd23f';g.beginPath();g.moveTo(30,-14);g.lineTo(42,-9);g.lineTo(30,-6);g.fill();               // beak
 g.fillStyle='#fff';g.beginPath();g.arc(23,-15,4,0,7);g.fill();g.fillStyle='#222';g.beginPath();g.arc(24,-15,2,0,7);g.fill();
 g.save();g.translate(-4,-6);g.rotate(-fl*.9-.15);g.fillStyle='#b9671f';                                         // wing
 g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(-14,-40,-44,-34);g.quadraticCurveTo(-30,-14,-22,6);g.closePath();g.fill();
 g.fillStyle='#8a4a14';g.beginPath();g.moveTo(-14,-14);g.quadraticCurveTo(-26,-28,-44,-34);g.quadraticCurveTo(-30,-12,-22,6);g.fill();g.restore();
 g.restore()}

function drawAlien(){const b=bird,bob=Math.sin(t*3)*3,fl=Math.sin(b.fl*.5);
 g.save();g.translate(b.x,b.y+bob);g.scale(b.face,1);g.rotate(Math.max(-.3,Math.min(.3,b.vy*.04)));
 g.fillStyle='rgba(130,255,170,.28)';g.beginPath();g.ellipse(0,44,24,6,0,0,7);g.fill();
 g.shadowColor='#8dffb0';g.shadowBlur=22;g.lineCap='round';g.lineWidth=5;g.strokeStyle='#8c959a';
 g.beginPath();g.moveTo(-8,12);g.lineTo(-30,-2+fl*12);g.moveTo(8,12);g.lineTo(30,-2-fl*12);g.moveTo(-4,34);g.lineTo(-6,46);g.moveTo(4,34);g.lineTo(6,46);g.stroke();
 g.fillStyle='#9aa3a8';g.beginPath();g.ellipse(0,18,12,19,0,0,7);g.fill();g.shadowBlur=0;
 g.fillStyle='#b4bcc0';g.beginPath();g.ellipse(0,-14,22,27,0,0,7);g.fill();
 g.fillStyle='#050807';g.beginPath();g.ellipse(-10,-12,10,5.5,.55,0,7);g.ellipse(10,-12,10,5.5,-.55,0,7);g.fill();
 g.fillStyle='#fff';g.beginPath();g.arc(-13,-14,1.8,0,7);g.arc(7,-14,1.8,0,7);g.fill();
 g.strokeStyle='#6c767b';g.lineWidth=1.5;g.beginPath();g.moveTo(-4,4);g.lineTo(4,4);g.stroke();g.restore()}
function fx(){if(fz<=0)return;const p=1-fz/TF,s=Math.sin(Math.PI*p);
 const bm=g.createLinearGradient(0,0,0,bird.y+50);bm.addColorStop(0,`rgba(150,255,190,${.55*s})`);bm.addColorStop(1,`rgba(150,255,190,${.15*s})`);
 g.fillStyle=bm;g.beginPath();g.moveTo(bird.x-18,0);g.lineTo(bird.x+18,0);g.lineTo(bird.x+80,bird.y+50);g.lineTo(bird.x-80,bird.y+50);g.fill();
 g.lineWidth=3;for(let k=0;k<3;k++){const q=(p*3+k/3)%1;g.strokeStyle=`rgba(130,255,170,${(1-q)*.8})`;g.beginPath();g.arc(bird.x,bird.y,q*170,0,7);g.stroke()}
 const f=Math.max(0,1-Math.abs(p-.5)*7);if(f>0){g.fillStyle=`rgba(255,255,255,${f})`;g.fillRect(0,0,W,H)}
 g.fillStyle='rgba(10,25,20,.7)';g.beginPath();g.roundRect(W/2-190,90,380,50,14);g.fill();g.fillStyle='#9dffb8';g.font='600 22px Georgia,serif';g.textAlign='center';g.textBaseline='middle';
 g.fillText(p<.5?'100 coins… something feels odd…':'Greetings, earthling. 👽',W/2,116);g.textAlign='left'}
function coin(k){const w=Math.abs(Math.cos(t*3+k.ph))*13+2;g.save();g.translate(k.x,k.y+Math.sin(t*2+k.ph)*4);
 g.shadowColor='#ffd23f';g.shadowBlur=14;g.fillStyle='#ffd23f';g.beginPath();g.ellipse(0,0,w,14,0,0,7);g.fill();g.shadowBlur=0;
 g.fillStyle='#e0a800';g.beginPath();g.ellipse(0,0,w*.6,9,0,0,7);g.fill();g.restore()}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
 // physics: ease toward target
 if(fz>0){fz-=dt;if(fz<TF/2)form=1;if(Math.random()<.7)sparks.push({x:bird.x+R(-45,45),y:bird.y+R(-45,45),vx:R(-60,60),vy:R(-170,-40),l:1,g:1})}
 if(fz<=0){const dx=tgt.x-bird.x,dy=tgt.y-bird.y;bird.vx+=dx*3*dt;bird.vy+=dy*3*dt;bird.vx*=.92;bird.vy*=.92;bird.x+=bird.vx*dt*3;bird.y+=bird.vy*dt*3;
 if(Math.abs(bird.vx)>8)bird.face=Math.sign(bird.vx);
 bird.fl+=dt*(12+Math.hypot(bird.vx,bird.vy)*.12+(dy<-20?8:0));
 coins=coins.filter(k=>{if(Math.hypot(k.x-bird.x,k.y-bird.y)<36){score++;if(score===100){fz=TF;tgt.x=bird.x;tgt.y=bird.y}for(let i=0;i<14;i++)sparks.push({x:k.x,y:k.y,vx:R(-160,160),vy:R(-200,60),l:1});return false}return true});spawn();}else bird.fl+=dt*40;
 sparks.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=400*dt;s.l-=dt*1.6});sparks=sparks.filter(s=>s.l>0);
 clouds.forEach(o=>{o.x+=o.v;if(o.x>W+120)o.x=-120});

 g.save();if(fz>0)g.translate(R(-6,6),R(-6,6));
 const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#7ec8f0');sky.addColorStop(.6,'#ffe2b8');sky.addColorStop(1,'#ffc58a');g.fillStyle=sky;g.fillRect(0,0,W,H);
 g.fillStyle='#fff6d6';g.shadowColor='#fff6d6';g.shadowBlur=60;g.beginPath();g.arc(780,110,42,0,7);g.fill();g.shadowBlur=0;
 g.fillStyle='rgba(255,255,255,.85)';clouds.forEach(o=>{g.beginPath();g.ellipse(o.x,o.y,60*o.s,18*o.s,0,0,7);g.ellipse(o.x+30*o.s,o.y-10*o.s,36*o.s,18*o.s,0,0,7);g.ellipse(o.x-30*o.s,o.y-4*o.s,30*o.s,14*o.s,0,0,7);g.fill()});
 g.fillStyle='#8fb6a8';g.beginPath();g.moveTo(0,420);for(let x=0;x<=W;x+=60)g.lineTo(x,380-Math.sin(x*.01)*50-Math.cos(x*.023)*30);g.lineTo(W,H);g.lineTo(0,H);g.fill();
 back.forEach(pine);mid.forEach(pine);
 coins.forEach(coin);form?drawAlien():drawBird();
 front.forEach(pine);
 sparks.forEach(s=>{g.fillStyle=s.g?`rgba(130,255,170,${s.l})`:`rgba(255,210,63,${s.l})`;g.beginPath();g.arc(s.x,s.y,3*s.l+1,0,7);g.fill()});
 fx();g.restore();
 g.fillStyle='rgba(20,40,40,.55)';g.beginPath();g.roundRect(18,16,150,44,12);g.fill();
 g.fillStyle='#ffd23f';g.beginPath();g.arc(42,38,11,0,7);g.fill();g.fillStyle='#fff';g.font='600 24px Georgia,serif';g.textBaseline='middle';g.fillText('× '+score,62,39);
 if(t<6){g.fillStyle='rgba(20,40,40,.55)';g.beginPath();g.roundRect(W/2-190,H-56,380,36,12);g.fill();g.fillStyle='#fff';g.font='16px Georgia,serif';g.textAlign='center';g.fillText('Tap or drag to fly · arrow keys work too',W/2,H-38);g.textAlign='left'}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
